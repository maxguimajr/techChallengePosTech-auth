name: CI/CD - Lambda de Autenticacao + API Gateway

on:
  push:
    branches: [main, homolog, "feature/*", "feat/*"]
  pull_request:
    branches: [main, homolog]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  TF_VERSION: 1.13.3
  AWS_REGION: us-east-1

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. CI - lint, testes, build e validacao do Terraform (sem credenciais AWS)
  # ─────────────────────────────────────────────────────────────────────────────
  ci:
    name: "🔍 CI - Testes & Qualidade"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: "📦 Instalar dependencias"
        run: npm ci

      - name: "🧹 Lint"
        run: npm run lint

      - name: "🔎 Typecheck"
        run: npm run typecheck

      - name: "🧪 Testes unitarios + cobertura"
        run: npm run test:cov

      - name: "🏗️ Build (esbuild)"
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-dist
          path: dist/
          retention-days: 7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "📐 Terraform fmt"
        run: terraform -chdir=terraform fmt -check -recursive

      - name: "✅ Terraform validate"
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. PLAN - em PR para homolog ou main (prod)
  # ─────────────────────────────────────────────────────────────────────────────
  plan:
    name: "📋 Terraform plan (${{ github.base_ref == 'main' && 'prod' || 'homolog' }})"
    if: github.event_name == 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ github.base_ref == 'main' && 'prod' || 'homolog' }}
    env:
      ENVIRONMENT: ${{ github.base_ref == 'main' && 'prod' || 'homolog' }}
      TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_app_base_url: ${{ vars.APP_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lambda-dist
          path: dist/

      - name: "🔑 Credenciais AWS (Learner Lab - temporarias)"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "⚙️ Terraform init"
        run: >
          terraform -chdir=terraform init -input=false
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=auth/${ENVIRONMENT}.tfstate"
          -backend-config="region=${AWS_REGION}"
          -backend-config="use_lockfile=true"

      - name: "📋 Terraform plan"
        run: terraform -chdir=terraform plan -input=false -var-file="environments/${ENVIRONMENT}.tfvars"

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. DEPLOY - push em homolog → homolog | push em main → prod
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: "🚀 Deploy (${{ github.ref_name == 'main' && 'prod' || 'homolog' }})"
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'homolog')
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
      url: ${{ steps.outputs.outputs.api_endpoint }}
    env:
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
      TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_app_base_url: ${{ vars.APP_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lambda-dist
          path: dist/

      - name: "🔑 Credenciais AWS (Learner Lab - temporarias)"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: "⚙️ Terraform init"
        run: >
          terraform -chdir=terraform init -input=false
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=auth/${ENVIRONMENT}.tfstate"
          -backend-config="region=${AWS_REGION}"
          -backend-config="use_lockfile=true"

      - name: "🚀 Terraform apply"
        run: terraform -chdir=terraform apply -input=false -auto-approve -var-file="environments/${ENVIRONMENT}.tfvars"

      - name: "📤 Outputs"
        id: outputs
        run: |
          API_ENDPOINT=$(terraform -chdir=terraform output -raw api_endpoint)
          echo "api_endpoint=${API_ENDPOINT}" >> "$GITHUB_OUTPUT"
          {
            echo "### 🚀 Deploy ${ENVIRONMENT}"
            echo "- API Gateway: ${API_ENDPOINT}"
            echo "- Autenticacao: \`POST $(terraform -chdir=terraform output -raw auth_url)\`"
            SG=$(terraform -chdir=terraform output -raw lambda_security_group_id)
            if [ -n "$SG" ]; then echo "- SG da Lambda (liberar 5432 no RDS): \`$SG\`"; else echo "- Lambda fora de VPC (RDS via endpoint publico)"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "💨 Smoke test"
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${{ steps.outputs.outputs.api_endpoint }}/auth/cpf" \
            -H 'content-type: application/json' -d '{"cpf":"000"}')
          echo "POST /auth/cpf com CPF invalido -> ${STATUS}"
          test "$STATUS" = "400"
